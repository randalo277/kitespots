<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Kite-Spots World Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Leaflet & MarkerCluster Stylesheets -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
    }

    /* Steuerungs-Container */
    .controls-container {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .search-box-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 16px 10px 38px;
      font-size: 14px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #64748b;
      pointer-events: none;
    }

    .search-results {
      position: absolute;
      top: 46px;
      left: 0;
      right: 0;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      max-height: 280px;
      overflow-y: auto;
      display: none;
      z-index: 1001;
      padding: 4px 0;
    }

    .result-item {
      padding: 8px 16px;
      font-size: 13px;
      color: #1e293b;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-item:hover {
      background: #f8fafc;
      color: #0284c7;
    }

    .result-item small {
      color: #94a3b8;
      font-size: 11px;
    }

    .status-badge {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* Standort-Button */
    .locate-btn {
      position: absolute;
      bottom: 24px;
      right: 20px;
      z-index: 1000;
      width: 46px;
      height: 46px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      outline: none;
      font-size: 20px;
      transition: background 0.2s, transform 0.1s;
    }

    .locate-btn:active {
      transform: scale(0.92);
    }

    /* Eigener Standort: Pulsierender blauer Punkt */
    .user-location-marker {
      width: 16px;
      height: 16px;
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    .wind-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .spot-popup {
      font-size: 13px;
      min-width: 210px;
    }

    .spot-popup h4 {
      margin: 0 0 6px 0;
      color: #0f172a;
      font-size: 15px;
    }

    .popup-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
    }

    .popup-btn {
      display: inline-block;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: center;
      transition: background 0.15s ease;
    }

    .btn-windy {
      background: #ea580c;
      color: #ffffff !important;
    }

    .btn-windfinder {
      background: #0284c7;
      color: #ffffff !important;
    }
  </style>
</head>
<body>

<div class="controls-container">
  <div class="search-box-wrapper">
    <span class="search-icon">🔍</span>
    <input 
      type="text" 
      id="spotSearchInput" 
      class="search-input" 
      placeholder="Spot suchen..." 
      autocomplete="off"
    />
    <div id="searchResults" class="search-results"></div>
  </div>
  <div id="statusBadge" class="status-badge">Lade Spots...</div>
</div>

<button id="locateBtn" class="locate-btn" title="Mein Standort">🎯</button>

<div id="map"></div>

<!-- Leaflet & MarkerCluster Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Lokale Kitespot-Daten -->
<script src="./spots.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const statusBadge = document.getElementById('statusBadge');
    const searchInput = document.getElementById('spotSearchInput');
    const searchResults = document.getElementById('searchResults');
    const locateBtn = document.getElementById('locateBtn');

    // Standardansicht Europa / Nordsee
    const map = L.map('map', {
      center: [53.8, 8.5],
      zoom: 7
    });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 200);

    const markers = L.markerClusterGroup({
      chunkedLoading: true,
      maxClusterRadius: 45,
      showCoverageOnHover: false
    });
    map.addLayer(markers);

    // Wetter-Popup
    function attachForecastPopup(marker, lat, lon, name) {
      marker.on('click', async () => {
        const windfinderUrl = `https://www.windfinder.com/#11/${lat}/${lon}`;
        const windyUrl = `https://www.windy.com/?${lat},${lon},11`;

        const baseContent = (windInfo) => `
          <div class="spot-popup">
            <h4>${name}</h4>
            ${windInfo}
            <div class="popup-actions">
              <a href="${windfinderUrl}" target="_blank" rel="noopener" class="popup-btn btn-windfinder">💨 Windfinder ↗</a>
              <a href="${windyUrl}" target="_blank" rel="noopener" class="popup-btn btn-windy">🌐 Windy ↗</a>
            </div>
          </div>
        `;

        marker.bindPopup(baseContent('<p>Lade Winddaten...</p>')).openPopup();

        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn`);
          const data = await res.json();
          const cur = data.current;

          const windDetails = `
            <p>Wind: <span class="wind-badge">${Math.round(cur.wind_speed_10m)} kn</span></p>
            <p>Böen: <strong>${Math.round(cur.wind_gusts_10m)} kn</strong></p>
            <p>Richtung: ${cur.wind_direction_10m}°</p>
          `;

          marker.setPopupContent(baseContent(windDetails));
        } catch (err) {
          marker.setPopupContent(baseContent('<p style="color: #ef4444;">Wetterdaten nicht erreichbar.</p>'));
        }
      });
    }

    // Spots laden
    const spotRegistry = [];
    const markerList = [];

    if (typeof SPOTS_DATA !== 'undefined') {
      const list = Array.isArray(SPOTS_DATA) ? SPOTS_DATA : (SPOTS_DATA.elements || []);
      list.forEach(item => {
        const lat = item.lat || (item.center && item.center.lat);
        const lon = item.lon || (item.center && item.center.lon);
        if (!lat || !lon) return;

        const name = item.name || (item.tags && (item.tags.name || item.tags.description)) || "Kitespot";
        const marker = L.marker([lat, lon]);
        attachForecastPopup(marker, lat, lon, name);
        markerList.push(marker);
        spotRegistry.push({ name, lat, lon, marker });
      });

      markers.addLayers(markerList);
      statusBadge.innerText = `✔ ${markerList.length.toLocaleString('de-DE')} Spots bereit`;
      setTimeout(() => { statusBadge.style.display = 'none'; }, 2500);
    } else {
      statusBadge.innerText = "⚠️ 'spots.js' nicht geladen.";
    }

    // Standort-Marker
    let userMarker = null;
    let userAccuracyCircle = null;

    const userIcon = L.divIcon({
      className: 'user-location-marker-container',
      html: '<div class="user-location-marker"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    function locateUser(zoomToLocation = true) {
      if (!navigator.geolocation) {
        alert("Geolocation wird von deinem Browser leider nicht unterstützt.");
        return;
      }

      statusBadge.innerText = "Ortung läuft...";
      statusBadge.style.display = 'block';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;

          if (userMarker) {
            userMarker.setLatLng([lat, lon]);
            userAccuracyCircle.setLatLng([lat, lon]).setRadius(accuracy);
          } else {
            userAccuracyCircle = L.circle([lat, lon], {
              radius: accuracy,
              color: '#3b82f6',
              fillColor: '#60a5fa',
              fillOpacity: 0.15,
              weight: 1
            }).addTo(map);

            userMarker = L.marker([lat, lon], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
            userMarker.bindPopup("<strong>Dein Standort</strong>");
          }

          if (zoomToLocation) {
            // Zoomt nah genug heran, sodass umliegende Spots sofort entclustert werden
            map.flyTo([lat, lon], 10, { duration: 1.5 });
          }

          statusBadge.innerText = "Standort gefunden";
          setTimeout(() => { statusBadge.style.display = 'none'; }, 2000);
        },
        (err) => {
          statusBadge.style.display = 'none';
          console.warn("Ortung fehlgeschlagen:", err.message);
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // Automatische Ortung beim Start
    locateUser(true);

    // Klick auf den Zielkreuz-Button zentriert erneut
    locateBtn.addEventListener('click', () => {
      locateUser(true);
    });

    // Autocomplete Suche
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      if (term.length < 2) {
        searchResults.style.display = 'none';
        searchResults.innerHTML = '';
        return;
      }

      const matches = spotRegistry
        .filter(item => item.name.toLowerCase().includes(term))
        .slice(0, 10);

      if (matches.length === 0) {
        searchResults.innerHTML = '<div class="result-item" style="color: #94a3b8; cursor: default;">Keine Spots gefunden</div>';
        searchResults.style.display = 'block';
        return;
      }

      searchResults.innerHTML = matches.map((item, idx) => `
        <div class="result-item" data-idx="${idx}">
          <span>${item.name}</span>
          <small>${item.lat.toFixed(2)}, ${item.lon.toFixed(2)}</small>
        </div>
      `).join('');

      searchResults.style.display = 'block';

      searchResults.querySelectorAll('.result-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = el.getAttribute('data-idx');
          const target = matches[idx];

          if (target) {
            searchResults.style.display = 'none';
            searchInput.value = target.name;
            map.flyTo([target.lat, target.lon], 13, { duration: 1.2 });

            setTimeout(() => {
              markers.zoomToShowLayer(target.marker, () => {
                target.marker.fire('click');
              });
            }, 1250);
          }
        });
      });
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box-wrapper')) {
        searchResults.style.display = 'none';
      }
    });
  });
</script>
</body>
</html>
